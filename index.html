:root{
  /* Paleta Lux 2026 */
  --navy:#0B2A3D; --navy-2:#1F4E6B; --blue:#2F6F8F; --blue-2:#4F7F99;
  --forest:#0F3834; --green:#4E7D5B; --lime:#8BC34A;
  --mist:#E6ECEF; --cream:#FBFFEF; --grey:#6B7C88;

  --ground:#E6ECEF; --surface:#FFFFFF; --surface-2:#FBFFEF; --surface-3:#DBE4E9;
  --ink:#0B2A3D; --ink-2:#3E5C6E; --ink-3:#6B7C88;
  --line:#C9D6DD; --line-strong:#A9BCC5;
  --accent:#1F4E6B; --accent-soft:#E1EBF1;
  --lime-ink:#5A8B26; --lime-soft:#EDF6DC;
  --tA:#5A8B26; --tA-soft:#EDF6DC;
  --tB:#4E7D5B; --tB-soft:#E5EFE8;
  --tC:#2F6F8F; --tC-soft:#E1EBF1;
  --tD:#6B7C88; --tD-soft:#E4EAEE;
  --btn-bg:#0B2A3D; --btn-fg:#FFFFFF;
  --deep:#0B2A3D; --deep-ink:#E6ECEF;
  --radius:8px;
  --f:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#071A25; --surface:#0B2A3D; --surface-2:#10364B; --surface-3:#1B4560;
    --ink:#E6ECEF; --ink-2:#A9BDC7; --ink-3:#7D94A1;
    --line:#194058; --line-strong:#2A5C7A;
    --accent:#7FB2CC; --accent-soft:#10364B;
    --lime-ink:#A3D465; --lime-soft:#17301A;
    --tA:#A3D465; --tA-soft:#1A3320;
    --tB:#7BB38B; --tB-soft:#16301F;
    --tC:#7FB2CC; --tC-soft:#0F3247;
    --tD:#93A7B2; --tD-soft:#172933;
    --btn-bg:#8BC34A; --btn-fg:#07202E;
    --deep:#04121A; --deep-ink:#D6E2E8;
  }
}
:root[data-theme="dark"]{
  --ground:#071A25; --surface:#0B2A3D; --surface-2:#10364B; --surface-3:#1B4560;
  --ink:#E6ECEF; --ink-2:#A9BDC7; --ink-3:#7D94A1;
  --line:#194058; --line-strong:#2A5C7A;
  --accent:#7FB2CC; --accent-soft:#10364B;
  --lime-ink:#A3D465; --lime-soft:#17301A;
  --tA:#A3D465; --tA-soft:#1A3320;
  --tB:#7BB38B; --tB-soft:#16301F;
  --tC:#7FB2CC; --tC-soft:#0F3247;
  --tD:#93A7B2; --tD-soft:#172933;
  --btn-bg:#8BC34A; --btn-fg:#07202E;
  --deep:#04121A; --deep-ink:#D6E2E8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6;font-weight:400;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- shell ---- */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}

CxxXRJ+Q3dtiWwPbATMMf27TA5pLeyHHMKJrXvBMXRxCe3DliNKfC4AnjRuoqexeSsfsp+f6nFGCsxqsFQt/8HGbC//a5IOFMAAAAASUVORK5CYII=);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.brand b{font-size:14px;font-weight:800;letter-spacing:.01em;line-height:1.15;display:block}
.brand span{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.navsearch{padding:14px 16px 8px}
.navsearch input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-2);color:var(--ink);font:inherit;font-size:13px}
.nav{padding:4px 12px 16px;display:flex;flex-direction:column;gap:1px;flex:1}
.navbtn{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;color:var(--ink-2);font-size:13.5px;font-weight:500;line-height:1.3}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:700;box-shadow:inset 2px 0 0 var(--lime)}
.navbtn .n{font-size:10.5px;font-weight:700;color:var(--ink-3);min-width:18px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.navbtn[aria-current="true"] .n{color:var(--lime-ink)}
.navbtn.done .n::after{content:"✓";margin-left:2px;color:var(--lime-ink)}
.navbtn.locked{opacity:.45}
.sidefoot{padding:14px 16px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.progwrap{display:flex;align-items:center;gap:10px}
.progbar{flex:1;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.progbar i{display:block;height:100%;background:var(--lime);border-radius:3px;transition:width .3s}
.progtxt{font-size:10.5px;font-weight:700;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--ink-2)}
.ghost:hover{border-color:var(--line-strong);color:var(--ink)}
.main{min-width:0;padding:0 0 90px}
.wrap{max-width:900px;margin:0 auto;padding-inline:26px;padding-block:36px 0}

/* ---- type ---- */
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--lime-ink);margin-bottom:10px}
.h-mod{font-size:clamp(25px,3.3vw,33px);line-height:1.14;font-weight:800;letter-spacing:-.02em;margin-bottom:11px}
.lede{font-size:16.5px;line-height:1.62;color:var(--ink-2);font-weight:400}
.sec{margin-top:40px}
.sec > h2{font-size:18px;font-weight:700;margin-bottom:4px}
.sec > .sub{color:var(--ink-3);font-size:13.5px;margin-bottom:16px}
.prose{font-size:15px;line-height:1.68;color:var(--ink-2);display:flex;flex-direction:column;gap:12px}
.prose strong{color:var(--ink);font-weight:700}
hr.rule{border:0;border-top:1px solid var(--line);margin:40px 0 0}

/* ---- primitives ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px 19px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(245px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(185px,1fr))}
.kv{display:flex;flex-direction:column;gap:3px}
.kv .k{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
.kv .v{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;padding:4px 9px;border-radius:4px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.chip.a{background:var(--tA-soft);color:var(--tA)}
.chip.b{background:var(--tB-soft);color:var(--tB)}
.chip.c{background:var(--tC-soft);color:var(--tC)}
.chip.d{background:var(--tD-soft);color:var(--tD)}
.chip.lime{background:var(--lime-soft);color:var(--lime-ink)}
.note{border-left:3px solid var(--lime);background:var(--surface-2);padding:13px 16px;border-radius:0 var(--radius) var(--radius) 0;font-size:14px;color:var(--ink-2);line-height:1.55}
.note b{font-weight:700;color:var(--ink)}
.note.alert{background:var(--deep);color:var(--deep-ink);border-left-color:var(--lime)}
.note.alert b{color:#FFFFFF}
:root[data-theme="dark"] .note.alert b,:root:not([data-theme="light"]) .note.alert b{color:var(--lime)}
.pend{border:1px dashed var(--line-strong);border-radius:var(--radius);padding:13px 16px;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.pend b{color:var(--ink-3);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;display:block;margin-bottom:5px}
ul.tick{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.tick li{display:flex;gap:11px;font-size:13.5px;color:var(--ink-2);line-height:1.5}
ul.tick li::before{content:"";flex:0 0 6px;height:6px;margin-top:8px;border-radius:1px;background:var(--lime);transform:rotate(45deg)}
ul.tick li > span{flex:1 1 auto;min-width:0}
ul.tick.no li::before{background:var(--ink-3);border-radius:50%;transform:none}
ul.tick li b{color:var(--ink)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:540px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
th{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:700;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{font-weight:700;color:var(--ink)}
td.faixa,th.faixa{white-space:nowrap;text-align:left;hyphens:manual;-webkit-hyphens:manual;width:1%;padding-right:20px}
.btn{background:var(--btn-bg);color:var(--btn-fg);border:0;border-radius:var(--radius);padding:10px 16px;font-size:13px;font-weight:700;letter-spacing:.02em}
.btn:hover{filter:brightness(1.12)}
.btn.sec2{background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
.btn.sec2:hover{filter:none;border-color:var(--ink-3);background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---- scorer ---- */
.scorer{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px;align-items:start}
.dims{display:flex;flex-direction:column;gap:9px}
.dim{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.dim h4{font-size:14px;font-weight:700;margin-bottom:3px}
.dim .hint{font-size:11.5px;color:var(--ink-3);margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(134px,1fr));gap:6px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:9px 10px;font-size:12.5px;line-height:1.4;color:var(--ink-2);text-align:left}
.opt:hover{border-color:var(--line-strong)}
.opt[aria-pressed="true"]{border-color:var(--lime);background:var(--lime-soft);color:var(--ink);font-weight:600}
.opt .pt{font-size:11px;font-weight:700;color:var(--ink-3);flex:0 0 auto;font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"] .pt{color:var(--lime-ink)}
.panel{position:sticky;top:24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:19px;display:flex;flex-direction:column;gap:15px}
.gauge{display:flex;align-items:baseline;gap:8px}
.gauge b{font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.gauge span{font-size:14px;font-weight:600;color:var(--ink-3)}
.tierbox{border-radius:6px;padding:13px 15px;display:flex;flex-direction:column;gap:6px}
.tierbox .t{font-weight:800;font-size:15px;display:flex;align-items:center;gap:9px}
.tierbox .t i{font-style:normal;font-size:21px;font-weight:800}
.tierbox p{font-size:12.5px;line-height:1.5}
.meter{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;display:flex}
.meter i{display:block;height:100%;transition:width .25s}
.flags{display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--ink-2)}
.flags label{display:flex;gap:9px;align-items:flex-start;cursor:pointer;line-height:1.4}
.flags input{margin-top:3px;accent-color:var(--navy-2)}

/* ---- pills / dossier ---- */
.segbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.segbtn{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.segbtn:hover{border-color:var(--line-strong);color:var(--ink)}
.segbtn[aria-pressed="true"]{background:var(--navy);color:#FFFFFF;border-color:var(--navy)}

{id:"quem-usa", obj:"Quem já usa isso? Me mostra um caso.", tags:["Prova"],

async function coachEval(id){
  const c=await ensureCoach(); if(!c) return;
  const o=OBJ.find(x=>x.id===id), txt=$('#ta-'+id).value.trim();
  if(txt.length<15){ $('#cn-'+id).textContent='Escreva um pouco mais para eu avaliar.'; return; }
  const btn=$('#cb-'+id); btn.disabled=true; btn.textContent='Avaliando…';
  const out=$('#co-'+id); out.hidden=false; out.textContent='Pensando…';
  const prompt=`Você é um gerente comercial sênior treinando um vendedor da LUXSolutions, plataforma de gestão de energia, água, utilities e Real Estate para operações multiponto.

OBJEÇÃO DO CLIENTE: "${o.obj}"
O QUE ESTÁ POR TRÁS: ${o.beneath}
RESPOSTA DE REFERÊNCIA (três movimentos):
${o.moves.map((m,i)=>`${i+1}. ${m.b}: "${m.t}"`).join('\n')}
ERRO COMUM A EVITAR: ${o.erro}

RESPOSTA ESCRITA PELO VENDEDOR:
"""${txt}"""

Avalie em no máximo 130 palavras, em português do Brasil, direto e sem rodeio, nesta estrutura exata:
O que funcionou: (uma ou duas frases concretas sobre o texto dele)
O que enfraquece: (o ponto mais caro do texto, com o motivo)
Reescreva assim: (uma versão melhorada, em uma ou duas frases, na voz dele)

Regras: não invente número, preço, prazo, cliente ou funcionalidade. Não use travessão. Não elogie por educação: se o texto só devolve a objeção sem pedir nada, diga isso. Verifique se existe um pedido com ação e data; se não existir, aponte.`;
  try{
    const r=await c(prompt,{modelTier:'default', onText:({text})=>{ out.textContent=text; }});
    out.textContent=r.text;
  }catch(e){
    out.textContent = e && e.code==='rate_limited' ? 'Limite de uso atingido. Tente daqui a pouco.' : 'Não consegui avaliar agora. Tente novamente em instantes.';
  }
  btn.disabled=false; btn.textContent='Pedir avaliação';
}

M('certificacao','08','Certificação','quiz prova certificacao teste',()=>`
${head('08','Avaliação','Certificação','Onze questões sobre o que decide uma venda: posicionamento, escopo, qualificação, cenários, demonstração, objeções e disciplina de funil. Cada resposta vem com correção comentada. A nota de corte da trilha é 80%.')}
<div class="sec"><div class="card" id="quizbox"></div></div>
`, ()=>{
  let i=0, acertos=0, answered=false;
  function draw(){
    const box=$('#quizbox');
    if(i>=CERT.length){
      const pct=Math.round(acertos/CERT.length*100);
      const msg = pct>=80 ? 'Aprovado. Você domina os pontos que decidem uma venda. Volte ao módulo 06 de tempos em tempos para manter as objeções afiadas.'
        : pct>=60 ? 'Quase lá. Revise os módulos 03 e 06, que concentram a maior parte dos erros, e refaça.'
        : 'Volte à trilha. Comece pelos módulos 01 e 03: entender a plataforma e qualificar bem é o que mais custa caro quando falha na frente do cliente.';
      box.innerHTML=`<div class="score"><b style="color:${pct>=80?'var(--lime-ink)':'var(--ink-3)'}">${pct}%</b><p><b>${acertos} de ${CERT.length}</b> corretas.</p><p>${msg}</p><button class="btn" type="button" id="q-again">Refazer</button></div>`;
      $('#q-again').addEventListener('click',()=>{ i=0;acertos=0;draw(); });
      store.set('cert',{pct,ts:Date.now()});
      return;
    }
    const q=CERT[i], alts=embaralhar(q.o);
    box.innerHTML=`
      <div class="qhead"><span class="qcount">Questão ${String(i+1).padStart(2,'0')} de ${CERT.length}</span><span class="qcount">${acertos} corretas</span></div>
      <div class="meter" style="margin-bottom:18px"><i style="width:${i/CERT.length*100}%;background:var(--lime)"></i></div>
      <p class="qq">${q.q}</p>
      <div class="quizopts" id="q-opts">${alts.map((o,j)=>`<button type="button" class="qopt" data-j="${j}"><span class="mark">${'ABC'[j]}</span><span>${o.t}</span></button>`).join('')}</div>
      <div id="q-fb"></div>`;
    answered=false;
    $$('#q-opts .qopt').forEach(b=>b.addEventListener('click',()=>{
      if(answered) return; answered=true;
      const j=+b.dataset.j, ok=alts[j].ok; if(ok) acertos++;
      $$('#q-opts .qopt').forEach((x,k)=>{ if(alts[k].ok) marcarCerta(x); });
      if(!ok) b.classList.add('wrong');
      $('#q-fb').innerHTML=`<div class="fb ${ok?'ok':'no'}" style="margin-top:12px"><b>${ok?'Certo.':'Não.'}</b> ${q.fb}</div><div class="row" style="margin-top:13px"><button class="btn" type="button" id="q-next">${i===CERT.length-1?'Ver resultado':'Próxima'}</button></div>`;
      $('#q-next').addEventListener('click',()=>{ i++; draw(); });
    }));
  }
  draw();
});

/* =====================================================================
   Hifenização em português. Duas camadas: o idioma no documento, para o
   hyphens:auto do navegador funcionar, e hifens virtuais inseridos no
   texto, que garantem a quebra mesmo onde o dicionário não existe.
   ===================================================================== */
const SHY='­';
const VOG='aeiouáéíóúâêôàãõäëïöüyAEIOUÁÉÍÓÚÂÊÔÀÃÕÄËÏÖÜY';
const isV=c=>VOG.indexOf(c)>=0;
const isC=c=>/[a-zà-ÿ]/i.test(c) && !isV(c);
const DIG=['ch','lh','nh'];
const CLU=['bl','br','cl','cr','dr','fl','fr','gl','gr','pl','pr','tr','tl','vr','vl'];
function shyWord(w){
  if(w.length<5 || w.indexOf(SHY)>=0) return w;
  const L=w.toLowerCase(), cortes=[];
  for(let i=1;i<L.length-1;i++){
    if(!isV(L[i-1])) continue;                 // só quebra depois de vogal
    if(!isC(L[i])) continue;                   // nunca entre vogais
    let pos;
    if(isV(L[i+1])) pos=i;                     // V-CV
    else if(isC(L[i+1])){
      const par=L[i]+L[i+1];
      if(DIG.includes(par)||CLU.includes(par)) pos=i;           // V-CCV: dígrafo ou grupo indivisível
      else if(isC(L[i+2]||'')){                                 // três consoantes
        const par2=L[i+1]+L[i+2];
        pos = (DIG.includes(par2)||CLU.includes(par2)) ? i+1 : i+2;
      } else pos=i+1;                                           // VC-CV
    } else continue;
    if(pos>=2 && pos<=L.length-2) cortes.push(pos);
  }
  if(!cortes.length) return w;
  let out='',prev=0;
  for(const p of cortes){ if(p<=prev) continue; out+=w.slice(prev,p)+SHY; prev=p; }
  return out+w.slice(prev);
}
const SHY_SEL='.lede,.prose p,.note,.pend,.beneath,.card p,.dosshead p,.fstep p,.kv .v,ul.tick li > span,.gitem span,.move .said,.coachout,.genout,.tierbox p,.score p,td';
const shyDone=new WeakSet();
function hifenizar(root){
  if(!root) return;
  root.querySelectorAll(SHY_SEL).forEach(el=>{
    const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
    let n;
    while((n=w.nextNode())){
      if(shyDone.has(n)) continue;
      shyDone.add(n);
      const t=n.nodeValue;
      if(!t || !/[A-Za-zÀ-ÿ]{5,}/.test(t)) continue;
      const novo=t.replace(/[A-Za-zÀ-ÿ]{5,}/g, shyWord);
      if(novo!==t) n.nodeValue=novo;
    }
  });
}
try{ document.documentElement.lang='pt-BR'; }catch(e){}
document.addEventListener('copy',e=>{
  const sel=window.getSelection?String(window.getSelection()):'';
  if(sel && sel.indexOf(SHY)>=0){
    e.clipboardData.setData('text/plain', sel.split(SHY).join(''));
    e.preventDefault();
  }
});

function buildNav(){
  $('#nav').innerHTML = MODULES.map(m=>`<button type="button" class="navbtn ${done[m.id]?'done':''}" data-id="${m.id}" data-k="${esc((m.nome+' '+m.keys).toLowerCase())}"><span class="n">${m.num}</span><span>${m.nome}</span></button>`).join('');
  $$('#nav .navbtn').forEach(b=>b.addEventListener('click',()=>go(b.dataset.id)));
  updProgress();
}
function updProgress(){
  const n=MODULES.filter(m=>done[m.id]).length;
  $('#prog-bar').style.width=(n/MODULES.length*100)+'%';
  $('#prog-txt').textContent=n+' / '+MODULES.length;
}
function go(id){
  const m=MODULES.find(x=>x.id===id)||MODULES[0], k=MODULES.indexOf(m);
  $('#view').innerHTML = m.render() + `
  <hr class="rule">
  <div class="row" style="justify-content:space-between;margin-top:24px;gap:12px">
    <button class="btn ${done[m.id]?'sec2':''}" type="button" id="mark">${done[m.id]?'Concluído ✓':'Marcar como concluído'}</button>
    <div class="row" style="gap:8px">
      ${k>0?`<button class="btn sec2" type="button" onclick="go('${MODULES[k-1].id}')">← ${MODULES[k-1].num}</button>`:''}
      ${k<MODULES.length-1?`<button class="btn" type="button" onclick="go('${MODULES[k+1].id}')">Próximo · ${MODULES[k+1].num} ${MODULES[k+1].nome} →</button>`:''}
    </div>
  </div>`;
  $$('#nav .navbtn').forEach(b=>b.setAttribute('aria-current', String(b.dataset.id===m.id)));
  $('#mark').addEventListener('click',()=>{
    done[m.id]=!done[m.id]; store.set('done',done);
    const btn=$('#mark'); btn.textContent=done[m.id]?'Concluído ✓':'Marcar como concluído'; btn.classList.toggle('sec2',!!done[m.id]);
    const nb=$(`#nav .navbtn[data-id="${m.id}"]`); if(nb) nb.classList.toggle('done',!!done[m.id]);
    updProgress();
  });
  if(m.after) try{ m.after(); }catch(e){ console.error(e); }
  hifenizar($('#view'));
  try{ location.hash='#'+m.id; }catch(e){}
  window.scrollTo({top:0,behavior:'instant'});
}
$('#nav-search').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase().trim();
  $$('#nav .navbtn').forEach(b=>{ b.hidden = q && !b.dataset.k.includes(q); });
});
function applyTheme(t){
  if(t==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  store.set('theme',t);
  $('#theme-btn').textContent = t==='auto'?'Tema: sistema':t==='dark'?'Tema: escuro':'Tema: claro';
}
$('#theme-btn').addEventListener('click',()=>{
  const order=['auto','light','dark'], cur=store.get('theme','auto');
  applyTheme(order[(order.indexOf(cur)+1)%3]);
});
applyTheme(store.get('theme','auto'));
buildNav();
const _view=document.getElementById('view');
if(window.MutationObserver && _view) new MutationObserver(()=>hifenizar(_view)).observe(_view,{childList:true,subtree:true});
go((location.hash||'').replace('#','') || 'plataforma');

</script>
